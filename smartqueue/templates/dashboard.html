<!DOCTYPE html>
<html>
<head>
    <title>Smart Queue - Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: #333;
            margin: 0; padding: 40px;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }
        .container {
            background: white; padding: 40px; border-radius: 15px;
            width: 100%; max-width: 800px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px;
        }
        .logout-btn { color: #e63946; text-decoration: none; font-weight: bold; }
        .options-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .option-card {
            background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 10px;
            padding: 25px; width: 210px; text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .option-card:hover { transform: translateY(-5px); border-color: #667eea; }
        .option-card h3 { margin-top: 0; margin-bottom: 20px; color: #2d3748; }
        .queue-btn {
            display: inline-block; background: #667eea; color: white;
            padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold;
            border: none; cursor: pointer; font-size: 15px;
        }
        .queue-btn:hover { background: #5a71e0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Welcome to Smart Queue</h1>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>

    <h2>Where would you like to queue?</h2>

    <div class="options-grid">
        <div class="option-card">
            <h3>Deans Cafe</h3>
            <button type="button" onclick="joinQueue('Deans Cafe')" class="queue-btn">Join Queue</button>
        </div>

        <div class="option-card">
            <h3>Haji Tapah</h3>
            <button type="button" onclick="joinQueue('Haji Tapah')" class="queue-btn">Join Queue</button>
        </div>

        <div class="option-card">
            <h3>Dapur Sahang</h3>
            <button type="button" onclick="joinQueue('Dapur Sahang')" class="queue-btn">Join Queue</button>
        </div>
    </div>
</div>

<script>
function joinQueue(location) {
    if (!navigator.geolocation) {
        alert("Your browser does not support GPS location.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {
            fetch("/take_number", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    location: location,
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude
                })
            })
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            });
        },
        function() {
            alert("Please allow location access to join the queue.");
        },
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}
</script>

</body>
</html>
