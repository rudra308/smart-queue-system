<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial;

            background: linear-gradient(to right, #667eea, #764ba2);

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {

            background: white;

            width: 90%;
            max-width: 400px;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);

            text-align: center;
        }

        h1 {

            margin-bottom: 30px;
            color: #333;
        }

        input {

            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            box-sizing: border-box;
        }

        button {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background: #667eea;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        a {

            display: block;

            margin-top: 20px;

            color: #667eea;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>Smart Queue Login</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="/register">
        Create New Account
    </a>

</div>

</body>
</html>
