<!DOCTYPE html>
<html>
<head>
    <title>Smart Queue System</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>

<header>
    <div class="nav-title">Smart Queue System</div>

    <nav>
        <a href="/dashboard">Home</a>
        <a href="/dashboard">Join Queue</a>
        <a href="/status">My Status</a>

        {% if session.get('role') == 'admin' %}
            <a href="/secure-staff-portal">Admin</a>
            <a href="/history">History</a>
        {% endif %}

        <a href="/logout">Logout</a>
    </nav>
</header>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="flash-box">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
