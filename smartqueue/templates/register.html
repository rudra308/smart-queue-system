<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial;

            background: linear-gradient(to right, #11998e, #38ef7d);

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {

            background: white;

            width: 90%;
            max-width: 400px;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);

            text-align: center;
        }

        h1 {

            margin-bottom: 30px;
            color: #333;
        }

        input {

            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            box-sizing: border-box;
        }

        button {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background: #11998e;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #0f7f76;
        }

        a {

            display: block;

            margin-top: 20px;

            color: #11998e;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="register-box">

    <h1>Create Account</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Choose Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Choose Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <a href="/login">
        Already have an account? Login
    </a>

</div>

</body>
</html>
