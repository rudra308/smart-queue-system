{% extends "layout.html" %}

{% block content %}
<div class="card services-page-card">
    <div class="card-title">Select a Service</div>

    {% if already_in_queue %}
    <div class="alert">
        <p><strong>You are already holding a spot in an active queue!</strong></p>
        <br>
        <a href="/cancel_queue" class="btn-danger">Cancel Current Spot & Join New One</a>
    </div>
    {% endif %}

    <form method="POST" class="centered-queue-form" {% if already_in_queue %}style="opacity: 0.5; pointer-events: none;"{% endif %}>
        <div class="large-services-grid">
            
            <label class="large-service-box">
                <input type="radio" name="service" value="canteen" required>
                <div class="box-content">
                    <span class="large-icon">☕</span>
                    <span class="large-name">Starbees</span>
                </div>
            </label>

            <label class="large-service-box">
                <input type="radio" name="service" value="clinic">
                <div class="box-content">
                    <span class="large-icon">🍲</span>
                    <span class="large-name">Haji Tapah Cafe</span>
                </div>
            </label>

            <label class="large-service-box">
                <input type="radio" name="service" value="office">
                <div class="box-content">
                    <span class="large-icon">🏢</span>
                    <span class="large-name">Office</span>
                </div>
            </label>

        </div>

        <button type="submit" class="btn-success large-submit-btn" {% if already_in_queue %}disabled{% endif %}>
            Confirm & Join Queue
        </button>
    </form>
</div>
{% endblock %}
