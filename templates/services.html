{% extends "layout.html" %}

{% block content %}

<div style="max-width:900px; margin:auto; padding:20px;">

    <h2 style="text-align:center; margin-bottom:20px;">
        🎫 Join a Queue
    </h2>

    <p style="text-align:center; color:#666;">
        Select a service to join the queue system
    </p>

    <form method="POST">

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:20px; margin-top:30px;">

            <!-- CANTEEN -->
            <label style="cursor:pointer;">
                <input type="radio" name="service" value="canteen" required hidden>

                <div class="card" style="padding:20px; text-align:center; border:2px solid #ddd; border-radius:12px; transition:0.3s;">
                    🍔
                    <h3>Canteen</h3>
                    <p>Food & Drinks Queue</p>
                </div>
            </label>

            <!-- CLINIC -->
            <label style="cursor:pointer;">
                <input type="radio" name="service" value="clinic" hidden>

                <div class="card" style="padding:20px; text-align:center; border:2px solid #ddd; border-radius:12px; transition:0.3s;">
                    🏥
                    <h3>Clinic</h3>
                    <p>Medical Services Queue</p>
                </div>
            </label>

            <!-- OFFICE -->
            <label style="cursor:pointer;">
                <input type="radio" name="service" value="office" hidden>

                <div class="card" style="padding:20px; text-align:center; border:2px solid #ddd; border-radius:12px; transition:0.3s;">
                    🏢
                    <h3>Office</h3>
                    <p>Admin Services Queue</p>
                </div>
            </label>

        </div>

        <div style="text-align:center; margin-top:30px;">
            <button type="submit"
                style="padding:12px 25px; border:none; background:#28a745; color:white; font-size:16px; border-radius:8px; cursor:pointer;">
                Join Queue
            </button>
        </div>

    </form>

</div>

{% endblock %}
