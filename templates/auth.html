{% extends "layout.html" %}

{% block content %}
<div class="card" style="max-width:500px; margin:auto;">

    <div class="card-title">
        Login / Register
    </div>

    <form method="POST">

        <div class="form-group">
            <label>Username</label>
            <input name="username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <div class="form-group">
            <button type="submit" class="btn-primary" name="action" value="login">
                Login
            </button>

            <button type="submit" class="btn-success" name="action" value="register">
                Register
            </button>
        </div>

    </form>

</div>
{% endblock %}
